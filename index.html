
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Your Personal Notes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Your simple space for ideas, reminders, and tasks.</p>
    </header>

    <main>
        <section class="section-card">
            <h2>Add a note</h2>

            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Note text</label>
                    <input
                        type="text"
                        id="note-input"
                        placeholder="What do you want to remember?"
                    >
                </div>

                <div class="form-group">
                    <label for="note-category">Category</label>
                    <select id="note-category">
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                    </select>
                </div>

                <button type="submit">Add Note</button>
            </form>

            <p id="error-message" role="alert"></p>
        </section>

        <section class="section-card">
            <h2>Your notes</h2>

            <label for="search-input">Search notes</label>
            <input
                type="search"
                id="search-input"
                placeholder="Search your notes..."
            >

            <p id="note-count" aria-live="polite">You have no notes yet.</p>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. Keep your ideas organized.</p>
    </footer>
</body>
</html>
